[tool.poetry]
name = "buyer-synthetic"
version = "1.0.0"
description = "AI-powered survey analysis platform with demographic sampling and electoral insights"
authors = ["Jorge Polanco Roque <jorge.polanco.roque@gmail.com>"]
maintainers = ["Jorge Polanco Roque <jorge.polanco.roque@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Jorge-Polanco-Roque/Buyer_Synthetic"
repository = "https://github.com/Jorge-Polanco-Roque/Buyer_Synthetic"
documentation = "https://github.com/Jorge-Polanco-Roque/Buyer_Synthetic/wiki"
keywords = [
    "ai", "surveys", "analysis", "demographics", "elections", "polling", 
    "market-research", "openai", "streamlit", "statistics", "langgraph"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Sociology",
]
packages = [{include = "buyer_synthetic", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
# Core dependencies
streamlit = "^1.46.0"
pandas = "^2.3.0"
numpy = "^2.3.0"
# AI/ML dependencies
openai = "^1.93.0"
langgraph = "^0.5.0"
langchain-core = "^0.3.0"
langchain-openai = "^0.3.0"
pydantic = "^2.11.0"
# Visualization
plotly = "^6.2.0"
matplotlib = "^3.10.0"
seaborn = "^0.13.0"
scipy = "^1.16.0"
# Utilities
python-dotenv = "^1.1.0"
typer = "^0.16.0"
rich = "^13.5.2"
httpx = "^0.28.0"
tenacity = "^9.1.0"
hvac = "^2.1.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.12.0"
coverage = "^7.6.0"
factory-boy = "^3.3.0"
faker = "^29.0.0"
# Code quality
black = "^24.0.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
mypy = "^1.13.0"
pre-commit = "^4.0.0"
ruff = "^0.8.0"
# Development tools
jupyter = "^1.1.0"
ipykernel = "^6.29.0"
ipython = "^8.29.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"
mkdocstrings = {extras = ["python"], version = "^0.26.0"}
mkdocs-gen-files = "^0.5.0"
mkdocs-literate-nav = "^0.6.0"
mkdocs-section-index = "^0.3.0"

[tool.poetry.group.deploy.dependencies]
gunicorn = "^23.0.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
docker = "^7.1.0"

[tool.poetry.group.security.dependencies]
bandit = "^1.7.0"
safety = "^3.2.0"

[tool.poetry.scripts]
buyer-synthetic = "buyer_synthetic.cli:app"
bs-dashboard = "buyer_synthetic.ui.dashboard:main"
bs-analyze = "buyer_synthetic.cli:analyze"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Development tools configuration
[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["buyer_synthetic"]
skip = [".venv", "venv", "build", "dist"]

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["E501", "B011"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "streamlit.*",
    "plotly.*",
    "seaborn.*",
    "matplotlib.*",
    "langgraph.*",
    "langchain.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=buyer_synthetic",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "openai: marks tests that require OpenAI API",
    "docker: marks tests that require Docker",
]

[tool.coverage.run]
source = ["src/buyer_synthetic"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]

[tool.safety]
# Ignore specific vulnerabilities if needed
ignore = []

[tool.semantic_release]
version_variable = "src/buyer_synthetic/__init__.py:__version__"
build_command = "poetry build"